[project]
name = "python-adobesign"
version = "0.1.0"
description = "Unofficial Python client for the Adobe Acrobat Sign REST API v6 — not an official Adobe SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Atkinson" }]
requires-python = ">=3.10"
keywords = ["adobe", "acrobat", "sign", "esignature", "e-signature", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/BenA-SA/python-adobesign"
Issues = "https://github.com/BenA-SA/python-adobesign/issues"
Changelog = "https://github.com/BenA-SA/python-adobesign/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adobesign"]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PLR0912",
    "PLR0915",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["adobesign"]
known-local-folder = ["endpoint_cases", "fixture_catalog", "helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/adobesign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: end-to-end tests against a real Acrobat Sign account (skipped without credentials)",
    "covers(target): the public client method a test exercises (read by the endpoint-coverage guard)",
]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["adobesign"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
